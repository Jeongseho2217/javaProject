<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>회원가입 용</title>
</head>
<body>
<form name="frmInput" method="post" action="insertMember2">
			<h3>회원 가입</h3>
		   성명		<input type="text" name="user_name"><br>
		   ID		<input type="text" name="user_id"><br>
		   비밀번호	<input type="password" name="user_pw"><br>
		   휴대폰 번호 <input type="text" name="user_phone_frt" size=3>-
		   <input type="text" name="user_phone_mid" size=3>-
		   <input type="text" name="user_phone_end" size=3><br>
		   학년
		   <input type="radio" name="grade" value="1">1학년
		   <input type="radio" name="grade" value="2">2학년
		   <input type="radio" name="grade" value="3">3학년
		   <input type="radio" name="grade" value="4">4학년<br>
		   
		   <tr><td>관심분야</td>
		   <td><input type="checkbox" name="interest" value="웹 프로그래밍">웹 프로그래밍
		   <input type="checkbox" name="interest" value="파이썬">파이썬
		   <input type="checkbox" name="interest" value="빅데이터">빅데이터
		   <input type="checkbox" name="interest" value="자바 프로그래밍">자바 프로그래밍</td></tr>
		   학과 <input type="checkbox" name="dept" value="컴공">
		   <br>
		   <input type="submit" value="완료">   
		   <input type="reset" value="취소">
	</form>
</body>
</html>
